<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Newsletter System</title>
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --danger: #e53e3e;
            --success: #38a169;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            margin: 0;
            background: #f7fafc;
            color: #2d3748;
        }
        .dashboard { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .stat-number { font-size: 2.5em; font-weight: bold; color: var(--primary); }
        .login-section { background: white; padding: 30px; border-radius: 10px; margin-bottom: 30px; text-align: center; max-width: 400px; margin: 40px auto; }
        .login-input { padding: 12px; width: 100%; box-sizing: border-box; border: 2px solid #e2e8f0; border-radius: 6px; font-size: 16px; margin-bottom: 12px; }
        .login-btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; width: 100%; }
        .logout-btn { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .hidden { display: none; }
        table { width: 100%; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #edf2f7; font-weight: 600; }
        #loginError { color: var(--danger); margin-top: 10px; min-height: 1.2em; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <div>
                <h1>Newsletter Admin Dashboard</h1>
                <p>Manage your newsletter subscribers</p>
            </div>
            <button class="logout-btn hidden" id="logoutBtn" onclick="logout()">Log out</button>
        </div>

        <div id="loginSection" class="login-section">
            <h2>Admin Login</h2>
            <p style="margin: 10px 0 20px; color: #666;">Sign in with the admin account you created in Supabase</p>
            <input type="email" id="adminEmail" class="login-input" placeholder="Email">
            <input type="password" id="adminPassword" class="login-input" placeholder="Password">
            <button onclick="login()" class="login-btn">Log in</button>
            <div id="loginError"></div>
        </div>

        <div id="dashboardContent" class="hidden">
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="subscriberCount">0</div>
                    <p>Total Subscribers</p>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="lastUpdated">Just now</div>
                    <p>Last Updated</p>
                </div>
            </div>

            <div class="stat-card">
                <h2>Subscriber List</h2>
                <button onclick="loadSubscribers()" style="margin-bottom: 20px;">Refresh List</button>
                <div id="subscribersTable"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function login() {
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = '';

            const { error } = await client.auth.signInWithPassword({ email, password });

            if (error) {
                errorEl.textContent = 'Invalid email or password.';
                return;
            }
            showDashboard();
        }

        async function logout() {
            await client.auth.signOut();
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('dashboardContent').classList.add('hidden');
            document.getElementById('logoutBtn').classList.add('hidden');
        }

        function showDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardContent').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');
            loadSubscribers();
        }

        async function loadSubscribers() {
            const { data, error } = await client
                .from('subscribers')
                .select('*')
                .order('subscribed_at', { ascending: false });

            if (error) {
                document.getElementById('subscribersTable').innerHTML =
                    '<p style="color: var(--danger);">Error loading subscribers: ' + error.message + '</p>';
                return;
            }

            document.getElementById('subscriberCount').textContent = data.length;
            document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();

            let html = '<table><tr><th>Email</th><th>Subscribed Date</th><th>Status</th></tr>';
            data.forEach(sub => {
                const date = new Date(sub.subscribed_at).toLocaleDateString('en-US', {
                    year: 'numeric', month: 'short', day: 'numeric'
                });
                html += '<tr>' +
                    '<td>' + escapeHtml(sub.email) + '</td>' +
                    '<td>' + date + '</td>' +
                    '<td><span style="color: var(--success);">' + (sub.active ? 'Active' : 'Inactive') + '</span></td>' +
                    '</tr>';
            });
            html += '</table>';
            document.getElementById('subscribersTable').innerHTML = html;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // If already logged in (session persisted), skip straight to dashboard
        client.auth.getSession().then(({ data }) => {
            if (data.session) showDashboard();
        });
    </script>
</body>
</html>
